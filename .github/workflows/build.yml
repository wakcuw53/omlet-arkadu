name: Build ArcadeLink APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-source.tar.gz.b64'
      - '.github/workflows/build.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Get project
        uses: actions/checkout@v4
      - name: Restore Android source
        run: base64 -d android-source.tar.gz.b64 | tar -xz
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable Android APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: ArcadeLink-v0.1-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
